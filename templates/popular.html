<section class="py-12 px-6 lg:px-12">
    <div class="mb-8 flex items-end justify-between">
        <div>
            <h3 class="text-3xl font-black uppercase italic tracking-tighter text-white">Mashhurlar <span class="text-primary">Hozir</span></h3>
            <p class="text-slate-400">Ushbu haftaning eng ko'p ko'rilgan shoulari</p>
        </div>
        <a class="group flex items-center gap-2 text-sm font-bold uppercase tracking-widest text-primary" href="{% url 'animelar' %}">
            Hammasini Ko'rish
            <span class="material-symbols-outlined transition-transform group-hover:translate-x-1">arrow_forward</span>
        </a>
    </div>
    <div class="grid grid-cols-2 gap-6 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6">
        {% for anime in popular_animes %}
        <div class="relative group flex flex-col cursor-pointer">
            <div class="relative aspect-[2/3] overflow-hidden rounded-xl border border-slate-100 shadow-sm">
                <img class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110"
                    src="{{ anime.image }}" alt="{{ anime.title }}">
                <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity z-10 flex flex-col justify-end p-4">
                    <button class="w-full py-2 bg-primary text-white rounded-lg font-bold text-sm flex items-center justify-center gap-2">
                        <span class="material-symbols-outlined text-lg">play_arrow</span> Ko'rish
                    </button>
                </div>
            </div>
            <div class="mt-2">
                <h3 class="font-bold text-slate-900 line-clamp-1 group-hover:text-primary transition-colors">{{ anime.title }}</h3>
                <p class="text-xs text-slate-500 mb-1">{{ anime.subtitle }}</p>
            </div>
        </div>
        {% endfor %}
    </div>
</section>

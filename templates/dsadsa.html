<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piano</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f5f5f5;
    }

    #piano-container {
      width: 1000px;
      margin: 20px auto;
      padding: 20px;
      background-color: white;
      border: 1px solid #ccc;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }

    .key-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .note {
      width: 40px;
      height: 100px;
      background-color: #f0f0f0;
      border: 1px solid #999;
      border-radius: 5px;
      font-size: 12px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .note:hover {
      background-color: #ddd;
    }

    .note:active {
      background-color: #aaa;
    }
  </style>
</head>
<body>
  <div id="piano-container">
    <!-- Piano keys will be generated by JavaScript -->
  </div>

  <script>
    const pianoContainer = document.getElementById("piano-container");
    const notes = ["C", "D", "E", "F", "G", "A", "B"];

    function createPianoKeys() {
      for (let i = 0; i < 7; i++) {
        const keyRow = document.createElement("div");
        keyRow.className = "key-row";
        pianoContainer.appendChild(keyRow);

        for (let j = 0; j < 7; j++) {
          const note = notes[j];
          const button = document.createElement("button");
          button.id = `${note}${i + 4}`;
          button.className = `note ${note}`;
          button.textContent = `${note}${i + 4}`;
          button.addEventListener("click", () => playNote(note));
          keyRow.appendChild(button);
        }
      }
    }

    function playNote(note) {
      console.log(`Playing note: ${note}`);
      // TODO: Implement sound playback using Web Audio API or another method
    }

    createPianoKeys();
  </script>
</body>
</html>

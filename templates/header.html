<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AnimeVault{% endblock %}</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0" />
</head>

<body class="bg-black text-white">

<header class="fixed top-0 z-50 w-full border-b border-white/10 bg-black/80 backdrop-blur">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">

        <!-- Logo -->
        <a href="{% url 'home' %}" class="flex items-center gap-2">
            <span class="text-violet-500 text-2xl font-black">⚡</span>
            <span class="text-xl font-bold">{{ brend }}</span>
        </a>

        <!-- Navigation -->
        <nav class="hidden gap-8 md:flex">
            <a href="{% url 'home' %}" class="text-sm hover:text-violet-400 transition">Bosh sahifa</a>
            <a href="{% url 'animelar' %}" class="text-sm hover:text-violet-400 transition">Animelar</a>
        </nav>

        <!-- Search -->
        <form method="GET" action="{% url 'animelar' %}" class="hidden md:block w-80">
            <div class="flex items-center rounded-xl bg-white/5 px-4 py-2 border border-white/10">
                <span class="material-symbols-outlined text-slate-400 mr-2">search</span>
                <input 
                    type="text"
                    name="q"
                    value="{{ request.GET.q }}"
                    placeholder="Anime qidirish..."
                    class="w-full bg-transparent outline-none text-sm placeholder:text-slate-500"
                />
            </div>
        </form>

    </div>
</header>

<main class="pt-20">
    {% block content %}{% endblock %}
</main>

</body>
</html>

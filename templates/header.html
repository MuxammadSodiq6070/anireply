<!DOCTYPE html>
<html lang="uz" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AnimeVault{% endblock %}</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    
    <style>
        /* Neon va Maxsus Effektlar */
        :root {
            --neon-purple: #9D50FF;
            --deep-dark: #0F051D;
        }
        body {
            background-color: var(--deep-dark);
            font-family: 'Inter', sans-serif;
        }
        .nav-glass {
            background: rgba(15, 5, 29, 0.8);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(157, 80, 255, 0.2);
        }
        .search-focus:focus-within {
            border-color: var(--neon-purple);
            box-shadow: 0 0 15px rgba(157, 80, 255, 0.3);
        }
        .logo-glow {
            text-shadow: 0 0 10px rgba(157, 80, 255, 0.8);
        }
        /* Mobil uchun pastki menyu animatsiyasi */
        .mobile-nav {
            background: rgba(26, 16, 46, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(157, 80, 255, 0.3);
        }
    </style>
</head>

<body class="text-slate-200">

<header class="fixed top-0 z-[100] w-full nav-glass">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-4 md:px-8 py-3 md:py-4">

        <a href="{% url 'home' %}" class="flex items-center gap-2 group">
            <div class="relative">
                <span class="text-3xl transition-transform group-hover:scale-110 duration-300 block logo-glow">⚡</span>
                <div class="absolute inset-0 bg-violet-600 blur-xl opacity-20 group-hover:opacity-50 transition-opacity"></div>
            </div>
            <span class="text-xl md:text-2xl font-black tracking-tighter text-white">
                ANIME<span class="text-[#9D50FF]">VAULT</span>
            </span>
        </a>

        <nav class="hidden md:flex items-center gap-10">
            <a href="{% url 'home' %}" class="text-sm font-semibold hover:text-[#9D50FF] transition-colors relative group">
                Bosh sahifa
                <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-[#9D50FF] transition-all group-hover:w-full"></span>
            </a>
            <a href="{% url 'animelar' %}" class="text-sm font-semibold hover:text-[#9D50FF] transition-colors relative group">
                Animelar
                <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-[#9D50FF] transition-all group-hover:w-full"></span>
            </a>
        </nav>

        <div class="hidden md:block flex-1 max-w-sm ml-10">
            <form method="GET" action="{% url 'animelar' %}" class="search-focus flex items-center rounded-2xl bg-white/5 px-4 py-2 border border-white/10 transition-all">
                <span class="material-symbols-outlined text-slate-400 text-xl">search</span>
                <input 
                    type="text"
                    name="q"
                    value="{{ request.GET.q|default:'' }}"
                    placeholder="Anime qidirish..."
                    class="w-full bg-transparent border-none outline-none px-3 text-sm text-white placeholder:text-slate-500"
                />
            </form>
        </div>

        <div class="flex items-center gap-4 ml-4">
             <button class="md:hidden text-white p-2">
                <span class="material-symbols-outlined">search</span>
             </button>
             <div class="h-8 w-8 rounded-full bg-gradient-to-tr from-[#9D50FF] to-[#00FFA3] p-[2px] cursor-pointer">
                 <div class="h-full w-full rounded-full bg-[#0F051D] flex items-center justify-center">
                    <span class="material-symbols-outlined text-sm">person</span>
                 </div>
             </div>
        </div>

    </div>
</header>

<div class="md:hidden fixed bottom-0 left-0 z-[100] w-full mobile-nav px-6 py-3">
    <div class="flex items-center justify-between">
        <a href="{% url 'home' %}" class="flex flex-col items-center gap-1 text-[#9D50FF]">
            <span class="material-symbols-outlined">home</span>
            <span class="text-[10px] font-bold uppercase">Asosiy</span>
        </a>
        <a href="{% url 'animelar' %}" class="flex flex-col items-center gap-1 text-slate-400">
            <span class="material-symbols-outlined">movie</span>
            <span class="text-[10px] font-bold uppercase">Animelar</span>
        </a>


    </div>
</div>




</body>
</html>

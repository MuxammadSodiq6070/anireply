<section class="bg-slate-900/40 py-16 px-6 lg:px-12 border-y border-primary/10">
    <div class="mb-10">
        <h3 class="text-3xl font-black uppercase italic tracking-tighter text-white">Yangi <span class="text-primary">Qismlar</span></h3>
        <p class="text-slate-400">Yaponiyadan yangi, bir necha daqiqa oldin yuklangan</p>
    </div>
    <div class="grid grid-cols-1 gap-8 md:grid-cols-2 xl:grid-cols-3">
        {% for anime in new_episodes_animes %}
        <div class="relative group flex flex-col cursor-pointer">
            <div class="relative aspect-[16/9] overflow-hidden rounded-xl border border-slate-100 shadow-sm">
                <img class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110"
                    src="{{ anime.image }}" alt="{{ anime.title }}">
                <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity z-10 flex flex-col justify-end p-4">
                    <button class="w-full py-2 bg-primary text-white rounded-lg font-bold text-sm flex items-center justify-center gap-2">
                        <span class="material-symbols-outlined text-lg">play_arrow</span> Ko'rish
                    </button>
                </div>
            </div>
            <div class="mt-2">
                <h3 class="font-bold text-white line-clamp-1 group-hover:text-primary transition-colors">{{ anime.title }}</h3>
                <p class="text-xs text-slate-500 mb-1">{{ anime.subtitle }}</p>
            </div>
        </div>
        {% endfor %}
    </div>
</section>
